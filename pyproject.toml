[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "math-teaching-agents"
version = "0.8.1"
description = "Multi-Agent System for Mathematics Teaching & Didactic Engineering"
readme = "README.md"
authors = [
  { name = "Math Teaching Agents Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20.0",
  "pyyaml>=6.0.0",
  "sympy>=1.12",
  "jinja2>=3.1.0",
  "colorama>=0.4.6",
  "pypdf>=4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.0.0",
  "flake8>=6.0.0"
]
office = [
  "docxtpl>=0.16.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.21"
]
visual = [
  "manim>=0.18.0"
]

[project.scripts]
math-agent = "math_teaching_agents.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
