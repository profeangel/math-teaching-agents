name: LaTeX Templates Compilation Check

on:
  push:
    paths:
      - 'templates/latex/**'
      - '.github/workflows/latex-check.yml'
  pull_request:
    paths:
      - 'templates/latex/**'

jobs:
  check-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Tectonic LaTeX Engine
        uses: WtfJoke/setup-tectonic@v4

      - name: Compile Minimal Dummy Evaluation
        run: |
          sed 's/<<METADATA_TITLE>>/Evaluación de Prueba/g; s/<<TOTAL_POINTS>>/30/g; s/<<CONTENT_BODY>>/\\section*{Pregunta 1}\\\\ Resuelva $x^2 - 4 = 0$./g' templates/latex/standard-evaluation.tex > test_eval.tex
          tectonic test_eval.tex
