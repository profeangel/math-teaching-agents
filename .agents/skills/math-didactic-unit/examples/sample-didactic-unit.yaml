# Ejemplo canónico de Unidad Didáctica conforme a schemas/didactic-unit.json
title: "Descubrimiento de la Función Cuadrática mediante Modelación Geométrica"
target_level: "secondary"
framework: "brousseau-tsd"
learning_goals:
  - "Deducir la relación cuadrática entre el lado y el área de una figura"
  - "Articular registro verbal, tabular y gráfico de la parábola"
phases:
  - phase_name: "Acción"
    didactic_intention: "Los estudiantes experimentan con cercados de perímetro constante y tabulan áreas"
    student_activity: "Calcular el área de rectángulos de perímetro 20 metros variando el ancho de 1 a 9 metros"
    teacher_role: "Devolución del problema sin dar pistas del área máxima"
  - phase_name: "Formulación"
    didactic_intention: "Construcción de conjeturas y modelos algebraicos preliminares"
    student_activity: "Escribir una expresión matemática para el área A(x) = x(10 - x)"
    teacher_role: "Moderar el intercambio entre parejas de estudiantes"
  - phase_name: "Validación"
    didactic_intention: "Comprobación de la hipótesis sobre el área máxima"
    student_activity: "Demostrar algebraicamente por qué el cuadrado (5x5) maximiza el área"
    teacher_role: "Exigir justificación matemática y refutación de contraejemplos"
  - phase_name: "Institucionalización"
    didactic_intention: "Formalización del concepto de función cuadrática y vértice"
    student_activity: "Sintetizar la forma canónica f(x) = a(x - h)^2 + k y su gráfica parabólica"
    teacher_role: "Sistematizar las definiciones, vocabulario y propiedades formales"
